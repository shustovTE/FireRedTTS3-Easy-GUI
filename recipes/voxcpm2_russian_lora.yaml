# Reference template only. Build a dataset-bound audited recipe with:
# .venv-voxcpm2/bin/python -m fireredtts3_local.voxcpm_training build-recipe
# The builder calculates updates from corpus size and requested epochs. It checks
# every target/reference against the official filter and model context limits.
# A full run starts from pinned Base; a pilot has its own output and is not resumed.
pretrained_path: models/VoxCPM2
train_manifest: training/datasets/voxcpm2-ru/train.jsonl
val_manifest: training/datasets/voxcpm2-ru/validation.jsonl
sample_rate: 16000
out_sample_rate: 48000
batch_size: 1
grad_accum_steps: 8
num_workers: 4
preprocessing_num_workers: 4
# Placeholder: build-recipe replaces these values from the actual dataset.
num_iters: 1000
max_steps: 1000
warmup_steps: 100
log_interval: 1
valid_interval: 100
save_interval: 100
learning_rate: 0.0001
weight_decay: 0.01
max_batch_tokens: 8192
max_grad_norm: 1.0
save_path: training/outputs/voxcpm2-ru-lora
tensorboard: training/outputs/voxcpm2-ru-lora/logs
lambdas:
  loss/diff: 1.0
  loss/stop: 1.0
lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 32
  alpha: 32
  dropout: 0.0
